<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoReMix</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen" class="splash-screen">
        <div class="splash-content">
            <h1>DoReMix</h1>
            <p class="splash-instruction">Record a 1 second sound</p>

            <div id="recording-status" class="recording-status"></div>

            <div class="recording-controls">
                <button id="record-btn" class="record-btn">
                    <img src="mic.png" alt="Record" class="mic-icon">
                </button>
            </div>

            <button id="continue-btn" class="continue-btn" style="display: none;">Continue</button>
        </div>
    </div>

    <div class="instructions">
        [↑↓] NAVIGATE<br>
        [SPACE] SELECT<br>
        [.] TO END <br>
      [←] TO UNDO<br>
        [DRAG] TO START NEW<br>
        [.] TO REPLAY<br>
        [ENTER] PLAY IN UNISON
    </div>

    <div class="canvas" id="canvas"></div>

    <script src="script.js"></script>
</body>
</html>
